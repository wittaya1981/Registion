// รายการกิจกรรมทั้งหมดแบบแบน พร้อมรหัส เช่น "3-2" = หมวดที่ 3 รายการที่ 2
const ACTIVITIES = [];
CATEGORIES.forEach(([categoryName, items], categoryIndex) => {
  items.forEach((item, itemIndex) => {
    ACTIVITIES.push({
      code: `${categoryIndex + 1}-${itemIndex + 1}`,
      category: categoryName,
      name: item.name,
      type: item.type,
    });
  });
});


/* ============================================================
   3) ฟังก์ชันช่วยเหลือ
   ============================================================ */

const $ = id => document.getElementById(id);

function showMessage(text) {
  $("msg").textContent = text || "";
}

// ป้องกันตัวอักษรพิเศษใน HTML
function escapeHtml(value) {
  const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" };
  return String(value ?? "").replace(/[&<>"]/g, ch => map[ch]);
}

// สีหัวหมวด (วนซ้ำทุก 8 หมวด)
function categoryColor(categoryName) {
  const index = CATEGORIES.findIndex(cat => cat[0] === categoryName);
  return `var(--c${index % 8})`;
}

// เรียก Supabase REST API
async function callApi(path, options = {}) {
  const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: HEADERS,
    ...options,
  });
  if (!response.ok) throw new Error(await response.text());

  const text = await response.text();
  return text ? JSON.parse(text) : [];
}

const HEADERS = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json",
};

// สร้าง HTML การ์ดกิจกรรมแบบสั้น
function activityCardHtml(activity) {
  return `
    <div class="activity-card">
      <b>${escapeHtml(activity.name)}</b>
      <div style="color:#64748b;font-size:.85rem">${escapeHtml(activity.type)}</div>
    </div>`;
}

// สร้าง HTML หัวหมวด
function categoryHeaderHtml(categoryName) {
  return `<div class="cat"><h3 style="background:${categoryColor(categoryName)}">${escapeHtml(categoryName)}</h3>`;
}


/* ============================================================
   4) เข้าสู่ระบบ / ออกจากระบบ / สลับหน้า
   ============================================================ */

let currentSchool = null;   // โรงเรียนที่ login อยู่
let savedCodes = {};        // รหัสกิจกรรมที่เคยบันทึกไว้แล้ว { "1-2": 1, ... }

function login() {
  const entered = $("codeInput").value.trim();
  const school = SCHOOLS.find(s => s.code === entered);

  if (!school) {
    showMessage("รหัสไม่ถูกต้อง");
    return;
  }
  sessionStorage.setItem("schoolCode", school.code);
  enterSystem(school);
}

function enterSystem(school) {
  currentSchool = school;
  showMessage("");
  $("codeInput").value = "";
  $("pageLogin").classList.add("hide");
  $("nav").classList.remove("hide");
  $("headerSub").textContent = school.name;
  showTab(1);
}

function logout() {
  sessionStorage.removeItem("schoolCode");
  currentSchool = null;

  ["page1", "page2", "page3", "nav", "saveBar"].forEach(id => $(id).classList.add("hide"));
  $("pageLogin").classList.remove("hide");
  $("headerSub").textContent = DEFAULT_SUBTITLE;
  showMessage("");
}

// สลับหน้า: 1 = สมัคร, 2 = สรุปของโรงเรียน, 3 = สรุปรวม
function showTab(tabNumber) {
  if (!currentSchool) return;

  [1, 2, 3].forEach(n => {
    $("page" + n).classList.toggle("hide", n !== tabNumber);
    $("nav" + n).classList.toggle("on", n === tabNumber);
  });
  $("saveBar").classList.toggle("hide", tabNumber !== 1);
  showMessage("");

  if (tabNumber === 1) loadForm();
  if (tabNumber === 2) loadMySummary();
  if (tabNumber === 3) loadAllSummary();
}


/* ============================================================
   5) หน้าสมัครกิจกรรม (เฉพาะโรงเรียนตัวเอง)
   ============================================================ */

function updateSelectedCount() {
  $("selectedCount").textContent = document.querySelectorAll("#formList input:checked").length;
}

async function loadForm() {
  showMessage("กำลังโหลด...");
  try {
    // ดึงรายการที่โรงเรียนนี้เคยสมัครไว้
    const rows = await callApi(
      "registrations?select=activity_code&school=eq." + encodeURIComponent(currentSchool.name)
    );
    savedCodes = {};
    rows.forEach(row => { savedCodes[row.activity_code] = 1; });

    // วาดฟอร์มแยกตามหมวด
    let html = "";
    CATEGORIES.forEach(([categoryName], categoryIndex) => {
      const items = ACTIVITIES.filter(a => a.category === categoryName);

      html += `<div class="cat">
        <h3 style="background:var(--c${categoryIndex % 8})">
          ${escapeHtml(categoryName)}<span>${items.length}</span>
        </h3>`;

      items.forEach(activity => {
        const checked = savedCodes[activity.code] ? "checked" : "";
        const tagClass = activity.type === "เดี่ยว" ? "tag" : "tag team";
        html += `
          <label class="item">
            <input type="checkbox" value="${activity.code}" ${checked} onchange="updateSelectedCount()">
            <span>${escapeHtml(activity.name)}
              <span class="${tagClass}">${escapeHtml(activity.type)}</span>
            </span>
          </label>`;
      });
      html += "</div>";
    });

    $("formList").innerHTML = html;
    updateSelectedCount();
    showMessage("");
  } catch (error) {
    showMessage("โหลดไม่สำเร็จ: " + error.message);
  }
}

async function saveRegistrations() {
  if (!currentSchool) return;

  const schoolName = currentSchool.name;
  const saveButton = document.querySelector("#saveBar button");
  saveButton.disabled = true;

  // รหัสกิจกรรมที่ติ๊กอยู่ตอนนี้
  const selectedCodes = new Set(
    [...document.querySelectorAll("#formList input:checked")].map(input => input.value)
  );

  // รายการที่ต้องเพิ่ม/อัปเดต
  const rowsToSave = ACTIVITIES
    .filter(activity => selectedCodes.has(activity.code))
    .map(activity => ({
      school: schoolName,
      activity_code: activity.code,
      category: activity.category,
      activity_name: activity.name,
      type: activity.type,
    }));

  // รายการที่เคยสมัครแต่ถูกติ๊กออก → ต้องลบ
  const codesToDelete = Object.keys(savedCodes).filter(code => !selectedCodes.has(code));

  showMessage("กำลังบันทึกข้อมูล...");
  try {
    if (rowsToSave.length) {
      await callApi("registrations?on_conflict=school,activity_code", {
        method: "POST",
        headers: { ...HEADERS, "Prefer": "resolution=merge-duplicates" },
        body: JSON.stringify(rowsToSave),
      });
    }

    for (const code of codesToDelete) {
      await callApi(
        "registrations?school=eq." + encodeURIComponent(schoolName) +
        "&activity_code=eq." + encodeURIComponent(code),
        { method: "DELETE", headers: { ...HEADERS, "Prefer": "return=minimal" } }
      );
    }

    savedCodes = {};
    rowsToSave.forEach(row => { savedCodes[row.activity_code] = 1; });
    showMessage(`บันทึกสำเร็จ ${rowsToSave.length} กิจกรรม`);
  } catch (error) {
    showMessage("บันทึกไม่สำเร็จ: " + (error.message || "ตรวจสอบการเชื่อมต่อ"));
  } finally {
    saveButton.disabled = false;
  }
}

   ============================================================ */

async function loadMySummary() {
  showMessage("กำลังโหลด...");
  try {
    const rows = await callApi(
      "registrations?select=activity_code&school=eq." + encodeURIComponent(currentSchool.name)
    );
    const myCodes = new Set(rows.map(row => row.activity_code));

    let html = `
      <div class="stat-row">
        <div><b>${myCodes.size}</b>กิจกรรมที่สมัคร</div>
        <div><b style="font-size:1rem">${escapeHtml(currentSchool.name)}</b>โรงเรียน</div>
      </div>`;

    if (myCodes.size === 0) {
      html += '<p class="empty-card">โรงเรียนนี้ยังไม่ได้สมัครกิจกรรม</p>';
    }

    // แสดงเฉพาะกิจกรรมที่สมัคร จัดกลุ่มตามหมวด
    let currentCategory = "";
    let categoryOpen = false;
    ACTIVITIES.forEach(activity => {
      if (!myCodes.has(activity.code)) return;

      if (activity.category !== currentCategory) {
        if (categoryOpen) html += "</div>";
        currentCategory = activity.category;
        categoryOpen = true;
        html += categoryHeaderHtml(currentCategory);
      }
      html += activityCardHtml(activity);
    });
    if (categoryOpen) html += "</div>";

    $("mySummary").innerHTML = html;
    showMessage("");
  } catch (error) {
    showMessage("โหลดไม่สำเร็จ: " + error.message);
  }
}


/* ============================================================
   7) หน้าสรุปรวมทุกโรงเรียน
      - กิจกรรมที่มีผู้สมัคร (พร้อมรายชื่อโรงเรียน)
      - กิจกรรมที่ไม่มีผู้สมัคร (แยกไว้ด้านล่าง)
   ============================================================ */

async function loadAllSummary() {
  showMessage("กำลังโหลดข้อมูลสรุป...");
  try {
    const rows = await callApi("registrations?select=school,activity_code");

    // จัดกลุ่ม: รหัสกิจกรรม → ชุดชื่อโรงเรียนที่สมัคร
    const schoolsByActivity = new Map();
    rows.forEach(row => {
      if (!schoolsByActivity.has(row.activity_code)) {
        schoolsByActivity.set(row.activity_code, new Set());
      }
      schoolsByActivity.get(row.activity_code).add(row.school);
    });

    const schoolsThatApplied = new Set(rows.map(row => row.school));

    let html = buildStatsHtml(rows.length, schoolsThatApplied.size);
    html += buildChartHtml(rows);

    // --- ส่วนที่ 1: กิจกรรมที่มีผู้สมัคร ---
    html += '<h3 class="section-title">กิจกรรมที่มีโรงเรียนสมัคร</h3>';

    const emptyActivities = [];
    let currentCategory = "";
    let categoryOpen = false;
    let activeCount = 0;

    ACTIVITIES.forEach(activity => {
      const schoolNames = [...(schoolsByActivity.get(activity.code) || [])];

      if (schoolNames.length === 0) {
        emptyActivities.push(activity);
        return;
      }

      if (activity.category !== currentCategory) {
        if (categoryOpen) html += "</div>";
        currentCategory = activity.category;
        categoryOpen = true;
        html += categoryHeaderHtml(currentCategory);
      }

      activeCount++;
      html += `
        <div class="activity-card">
          <b>${escapeHtml(activity.name)}</b>
          <div style="color:#64748b;font-size:.85rem;margin:4px 0 7px">
            ${escapeHtml(activity.type)} · สมัคร ${schoolNames.length} โรงเรียน
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${schoolNames.map(name => `<span class="school-chip">${escapeHtml(name)}</span>`).join("")}
          </div>
        </div>`;
    });
    if (categoryOpen) html += "</div>";
    if (activeCount === 0) html += "<p>ยังไม่มีโรงเรียนสมัครกิจกรรมใด</p>";

    // --- ส่วนที่ 2: กิจกรรมที่ไม่มีผู้สมัคร ---
    html += buildEmptyActivitiesHtml(emptyActivities);

    $("allSummary").innerHTML = html;
    showMessage("");
  } catch (error) {
    showMessage("โหลดสรุปไม่สำเร็จ: " + error.message);
  }
}

// กล่องตัวเลขสรุปด้านบน
function buildStatsHtml(totalRegistrations, schoolCount) {
  return `
    <div class="stat-row">
      <div><b>${totalRegistrations}</b>รายการสมัครทั้งหมด</div>
      <div><b>${schoolCount}/${SCHOOLS.length}</b>โรงเรียนที่สมัครแล้ว</div>
    </div>`;
}

// แผนภูมิแท่ง: จำนวนกิจกรรมที่แต่ละโรงเรียนสมัคร
function buildChartHtml(rows) {
  const counts = SCHOOLS.map(school => ({
    name: school.name,
    count: rows.filter(row => row.school === school.name).length,
  }));
  const maxCount = Math.max(1, ...counts.map(item => item.count));

  const barsHtml = counts.map(item => `
    <div class="chart-row">
      <div>${escapeHtml(item.name)}</div>
      <div class="chart-track">
        <div class="chart-bar" style="width:${(item.count / maxCount) * 100}%"></div>
      </div>
      <b>${item.count}</b>
    </div>`).join("");

  return `
    <div class="chart-box">
      <h3 class="section-title" style="margin-top:0">จำนวนกิจกรรมที่แต่ละโรงเรียนสมัคร</h3>
      ${barsHtml}
    </div>`;
}

// รายการกิจกรรมที่ไม่มีผู้สมัคร จัดกลุ่มตามหมวด
function buildEmptyActivitiesHtml(emptyActivities) {
  let html = `<h3 class="section-title" style="color:#b91c1c">
                กิจกรรมที่ไม่มีผู้สมัคร (${emptyActivities.length} รายการ)</h3>`;

  if (emptyActivities.length === 0) {
    return html + '<p style="color:#166534">ทุกกิจกรรมมีโรงเรียนสมัครแล้ว</p>';
  }

  let currentCategory = "";
  emptyActivities.forEach(activity => {
    if (activity.category !== currentCategory) {
      currentCategory = activity.category;
      html += `<h4 style="color:#991b1b;margin:10px 0 5px">${escapeHtml(currentCategory)}</h4>`;
    }
    html += `
      <div class="empty-card">
        <b>${escapeHtml(activity.name)}</b>
        <div style="font-size:.85rem">${escapeHtml(activity.type)}</div>
      </div>`;
  });
  return html;
}


/* ============================================================
   8) เริ่มต้น: ถ้ายัง login ค้างใน session เดิม ให้เข้าระบบอัตโนมัติ
   ============================================================ */

const rememberedCode = sessionStorage.getItem("schoolCode");
if (rememberedCode) {
  const rememberedSchool = SCHOOLS.find(s => s.code === rememberedCode);
  if (rememberedSchool) enterSystem(rememberedSchool);
}
