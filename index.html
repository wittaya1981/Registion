 ["สังคมศึกษา ศาสนา วัฒนธรรม",[...a("การแข่งขันโครงงานคุณธรรม",L3,"ทีม 5 คน"),...a("กิจกรรมมารยาทไทย",L3,"ทีม 2 คน")]],
 ["นักบินน้อย",[{n:"การแข่งขันเครื่องร่อนแบบเดินตาม ป.1-ป.3",t:"ทีม 2 คน"},{n:"การแข่งขันเครื่องร่อน ประเภทร่อนนานปล่อยด้วยมือ ป.4-ป.6",t:"ทีม 2 คน"},{n:"การแข่งขันเครื่องบินพลังยาง ประเภทบินนานปล่อยอิสระ ม.1-ม.3",t:"ทีม 2 คน"}]]
];
// กำหนดรหัสกิจกรรม
const ACTS=[];
CATS.forEach(([c,list],ci)=>list.forEach((x,i)=>ACTS.push({code:`${ci+1}-${i+1}`,cat:c,name:x.n,type:x.t})));

const H={
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

const api=(p,o={})=>fetch(SUPABASE_URL+"/rest/v1/"+p,{headers:H,...o}).then(async r=>{if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):[]});
const $=id=>document.getElementById(id), msg=t=>$("msg").textContent=t||"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("s1").innerHTML='<option value="">-- เลือกโรงเรียน --</option>'+SCHOOLS.map(s=>`<option>${esc(s)}</option>`).join("");
$("s2").innerHTML='<option value="">ทุกโรงเรียน</option>'+SCHOOLS.map(s=>`<option>${esc(s)}</option>`).join("");

function tab(n){
  $("p1").classList.toggle("hide",n!==1);$("p2").classList.toggle("hide",n!==2);
  $("n1").classList.toggle("on",n===1);$("n2").classList.toggle("on",n===2);
  msg(""); if(n===2) loadSummary();
}
function count(){$("cnt").textContent=document.querySelectorAll("#list input:checked").length}

let saved={};
async function loadForm(){
  const s=$("s1").value;
  if(!s){$("list").innerHTML="";$("bar").classList.add("hide");return}
  msg("กำลังโหลด...");
  try{
    const rows=await api("registrations?select=activity_code&school=eq."+encodeURIComponent(s));
    saved={};rows.forEach(r=>saved[r.activity_code]=1);
    let h="";
    CATS.forEach(([c],ci)=>{
      const it=ACTS.filter(x=>x.cat===c);
      h+=`<div class="cat"><h3 style="background:var(--c${ci%8})">${esc(c)}<span>${it.length}</span></h3>`;
      it.forEach(x=>{h+=`<label class="it"><input type="checkbox" value="${x.code}" ${saved[x.code]?"checked":""} onchange="count()"><span>${esc(x.name)}<span class="tg ${x.type==="เดี่ยว"?"":"t"}">${esc(x.type)}</span></span></label>`});
      h+="</div>";
    });
    $("list").innerHTML=h;$("bar").classList.remove("hide");count();msg("");
  }catch(e){msg("โหลดไม่สำเร็จ: "+e.message)}
}

/* ===== บันทึกข้อมูลลง Supabase ===== */
async function saveAll(){
  const school = $("s1").value;
  if(!school){ msg("กรุณาเลือกโรงเรียนก่อนบันทึก"); return; }

  const button = document.querySelector('#bar button');
  if(button) button.disabled = true;

  const selected = new Set(
    [...document.querySelectorAll('#list input[type="checkbox"]:checked')].map(input => input.value)
  );
  const toSave = ACTS
    .filter(activity => selected.has(activity.code))
    .map(activity => ({
      school,
      activity_code: activity.code,
      category: activity.cat,
      activity_name: activity.name,
      type: activity.type
    }));
  const toDelete = Object.keys(saved).filter(code => !selected.has(code));

  msg("กำลังบันทึกข้อมูล...");
  try {
    // เพิ่มหรือปรับปรุงรายการที่เลือก โดยอาศัย unique constraint school + activity_code
    if(toSave.length){
      await api("registrations?on_conflict=school,activity_code", {
        method: "POST",
        headers: { ...H, "Prefer": "resolution=merge-duplicates" },
        body: JSON.stringify(toSave)
      });
    }

    // ลบรายการที่เคยบันทึกไว้ แต่ผู้ใช้ยกเลิกการเลือก
    for(const code of toDelete){
      await api(
        "registrations?school=eq." + encodeURIComponent(school) + "&activity_code=eq." + encodeURIComponent(code),
        { method: "DELETE", headers: { ...H, "Prefer": "return=minimal" } }
      );
    }

    saved = {};
    toSave.forEach(item => { saved[item.activity_code] = 1; });
    count();
    msg(`บันทึกสำเร็จ ${toSave.length} กิจกรรม`);
  } catch(error) {
    console.error("Save error:", error);
    msg("บันทึกไม่สำเร็จ: " + (error.message || "โปรดตรวจสอบการเชื่อมต่อและสิทธิ์ Supabase"));
  } finally {
    if(button) button.disabled = false;
  }
}

/* ===== สรุปข้อมูลการสมัคร ===== */
async function loadSummary(){
  const school = $("s2").value;
  $("sum").innerHTML = "";
  msg("กำลังโหลดข้อมูลสรุป...");
  try {
    let endpoint = "registrations?select=school,category,activity_name,type&order=school.asc,category.asc";
    if(school) endpoint += "&school=eq." + encodeURIComponent(school);
    const rows = await api(endpoint);

    const schoolSet = new Set(rows.map(row => row.school));
    const categoryCounts = {};
    rows.forEach(row => {
      const key = row.category || "ไม่ระบุหมวดหมู่";
      categoryCounts[key] = (categoryCounts[key] || 0) + 1;
    });

    let html = `<div class="big">
      <div><b>${rows.length}</b>รายการสมัครทั้งหมด</div>
      <div><b>${schoolSet.size}</b>โรงเรียนที่สมัคร</div>
    </div>`;

    if(!rows.length){
      html += '<p style="text-align:center;background:#fff;padding:18px;border-radius:12px;margin-top:12px">ยังไม่มีข้อมูลการสมัคร</p>';
    } else {
      html += '<h3>สรุปตามหมวดหมู่</h3><table><thead><tr><th>หมวดหมู่</th><th>จำนวนกิจกรรม</th></tr></thead><tbody>';
      Object.entries(categoryCounts).sort((a,b) => a[0].localeCompare(b[0], 'th')).forEach(([category,total]) => {
        html += `<tr><td>${esc(category)}</td><td>${total}</td></tr>`;
      });
      html += '</tbody></table>';

      html += '<h3>รายละเอียดการสมัคร</h3><table><thead><tr><th>โรงเรียน</th><th>กิจกรรม</th><th>ประเภท</th></tr></thead><tbody>';
      rows.forEach(row => {
        html += `<tr><td>${esc(row.school)}</td><td>${esc(row.activity_name)}</td><td>${esc(row.type)}</td></tr>`;
      });
      html += '</tbody></table>';
    }
    $("sum").innerHTML = html;
    msg("");
  } catch(error) {
    console.error("Summary error:", error);
    msg("โหลดสรุปไม่สำเร็จ: " + (error.message || "โปรดตรวจสอบการเชื่อมต่อ Supabase"));
  }
}

// เริ่มต้นแสดงจำนวนกิจกรรมที่เลือก
count();
</script>
