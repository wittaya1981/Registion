const ACTS=[];
CATS.forEach(([c,list],ci)=>list.forEach((x,i)=>ACTS.push({code:`${ci+1}-${i+1}`,cat:c,name:x.n,type:x.t})));


const H={apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"};
const api=(p,o={})=>fetch(SUPABASE_URL+"/rest/v1/"+p,{headers:H,...o}).then(async r=>{if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):[]});
const $=id=>document.getElementById(id), msg=t=>$("msg").textContent=t||"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("s1").innerHTML='<option value="">-- เลือกโรงเรียน --</option>'+SCHOOLS.map(s=>`<option>${esc(s)}</option>`).join("");
$("s2").innerHTML='<option value="">ทุกโรงเรียน</option>'+SCHOOLS.map(s=>`<option>${esc(s)}</option>`).join("");

function tab(n){
  $("p1").classList.toggle("hide",n!==1);$("p2").classList.toggle("hide",n!==2);
  $("n1").classList.toggle("on",n===1);$("n2").classList.toggle("on",n===2);
  msg(""); if(n===2) loadSummary();
}
function count(){$("cnt").textContent=document.querySelectorAll("#list input:checked").length}

let saved={};
async function loadForm(){
  const s=$("s1").value;
  if(!s){$("list").innerHTML="";$("bar").classList.add("hide");return}
  msg("กำลังโหลด...");
  try{
    const rows=await api("registrations?select=activity_code&school=eq."+encodeURIComponent(s));
    saved={};rows.forEach(r=>saved[r.activity_code]=1);
    let h="";
    CATS.forEach(([c],ci)=>{
      const it=ACTS.filter(x=>x.cat===c);
      h+=`<div class="cat"><h3 style="background:var(--c${ci%8})">${esc(c)}<span>${it.length}</span></h3>`;
      it.forEach(x=>{h+=`<label class="it"><input type="checkbox" value="${x.code}" ${saved[x.code]?"checked":""} onchange="count()"><span>${esc(x.name)}<span class="tg ${x.type==="เดี่ยว"?"":"t"}">${esc(x.type)}</span></span></label>`});
      h+="</div>";
    });
    $("list").innerHTML=h;$("bar").classList.remove("hide");count();msg("");
  }catch(e){msg("โหลดไม่สำเร็จ: "+e.message)}
}
async function saveAll(){
  const s=$("s1").value;if(!s)return;
  const on=new Set([...document.querySelectorAll("#list input:checked")].map(i=>i.value));
  const up=ACTS.filter(x=>on.has(x.code)).map(x=>({school:s,activity_code:x.code,category:x.cat,activity_name:x.name,type:x.type}));
  const del=Object.keys(saved).filter(c=>!on.has(c));
  msg("กำลังบันทึก...");
  try{
    if(up.length)await api("registrations?on_conflict=school,activity_code",{method:"POST",headers:{...H,Prefer:"resolution=merge-duplicates"},body:JSON.stringify(up)});
    for(const c of del)await api(`registrations?school=eq.${encodeURIComponent(s)}&activity_code=eq.${c}`,{method:"DELETE"});
    saved={};up.forEach(x=>saved[x.activity_code]=1);
    msg("บันทึกแล้ว "+up.length+" กิจกรรม");
  }catch(e){msg("บันทึกไม่สำเร็จ: "+e.message)}
}

async function loadSummary(){
  const s=$("s2").value;msg("กำลังโหลด...");
  try{
    const rows=await api("registrations?select=school,activity_code,category,activity_name,type"+(s?"&school=eq."+encodeURIComponent(s):""));
    let h="";
    if(!s){
      const n={};SCHOOLS.forEach(x=>n[x]=0);rows.forEach(r=>n[r.school]=(n[r.school]||0)+1);
      h=`<div class="big"><div><b>${rows.length}</b>การสมัครทั้งหมด</div><div><b>${Object.values(n).filter(v=>v).length}/${SCHOOLS.length}</b>โรงเรียนที่สมัครแล้ว</div></div><table><tr><th>โรงเรียน</th><th>กิจกรรมที่สมัคร</th></tr>`+Object.entries(n).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join("")+`<tr><th>รวม</th><th>${rows.length}</th></tr></table>`;
    }else{
      rows.sort((a,b)=>a.activity_code.localeCompare(b.activity_code,undefined,{numeric:true}));
      h=`<div class="big"><div><b>${rows.length}</b>${esc(s)}</div><div><b>${ACTS.length-rows.length}</b>ยังไม่สมัคร</div></div>`;
      if(rows.length)h+=`<table><tr><th>#</th><th>หมวด</th><th>กิจกรรม</th><th>ประเภท</th></tr>`+rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.category)}</td><td>${esc(r.activity_name)}</td><td>${esc(r.type)}</td></tr>`).join("")+`</table><p><button onclick="window.print()">พิมพ์</button></p>`;
    }
    $("sum").innerHTML=h;msg("");
  }catch(e){msg("โหลดไม่สำเร็จ: "+e.message)}
}
</script>
</body>
</html>
