    ...mkDis("การแข่งขันการประดิษฐ์ของเล่นจากเศษวัสดุเหลือใช้", [INT, LRN], P, "ทีม 3 คน"),
    ...mkDis("การแข่งขันการร้อยมาลัยดอกไม้สด", [INT, LRN], P, "ทีม 3 คน"),
    ...mkDis("การแข่งขันการจัดสวนถาดแบบชื้น", [LRN], P, "ทีม 3 คน"),
    ...mkDis("การแข่งขันการจัดสวนถาดแบบแห้ง", [LRN], P, "ทีม 3 คน")]],
  ["เรียนรวม ศิลปะ", [
    ...mkDis("การแข่งขันการวาดภาพระบายสี", [HEAR, INT, BODY, LRN], L2, "เดี่ยว"),
    ...mk("การแข่งขันการวาดภาพระบายสี ประเภทนักเรียนออทิสติก", L2, "เดี่ยว"),
    ...mkDis("การประกวดการขับร้องเพลงไทยลูกทุ่ง", [SEE, INT, BODY, LRN], L2, "เดี่ยว"),
    ...mk("การประกวดการขับร้องเพลงไทยลูกทุ่ง ประเภทนักเรียนออทิสติก", L2, "เดี่ยว"),
    { name: "การแข่งขันการเต้นหางเครื่องประกอบเพลง ประเภทนักเรียนที่มีความบกพร่องทางการเรียนรู้ ป.1-ป.6", type: "ทีม 7 คน" }]],
  ["ศิลปวัฒนธรรมอีสาน", [
    ...mk("การแข่งขันเดี่ยวโปงลาง", L2, "เดี่ยว"), ...mk("การแข่งขันเดี่ยวโหวด", L2, "เดี่ยว"),
    ...mk("การแข่งขันเดี่ยวพิณ", L2, "เดี่ยว"), ...mk("การแข่งขันเดี่ยวแคน", L2, "เดี่ยว"),
    ...mk("การแข่งขันวงดนตรีพื้นเมืองอีสาน (โปงลาง)", L2, "ทีม 30 คน")]],
  ["สังคมศึกษา ศาสนา วัฒนธรรม", [...mk("การแข่งขันโครงงานคุณธรรม", L3, "ทีม 5 คน"), ...mk("กิจกรรมมารยาทไทย", L3, "ทีม 2 คน")]],
  ["นักบินน้อย", [
    { name: "การแข่งขันเครื่องร่อนแบบเดินตาม ป.1-ป.3", type: "ทีม 2 คน" },
    { name: "การแข่งขันเครื่องร่อน ประเภทร่อนนานปล่อยด้วยมือ ป.4-ป.6", type: "ทีม 2 คน" },
    { name: "การแข่งขันเครื่องบินพลังยาง ประเภทบินนานปล่อยอิสระ ม.1-ม.3", type: "ทีม 2 คน" }]],
];

// รายการแบบแบน พร้อมรหัส เช่น "3-2" = หมวดที่ 3 รายการที่ 2
const ACTIVITIES = CATEGORIES.flatMap(([category, items], ci) =>
  items.map((item, i) => ({ code: `${ci + 1}-${i + 1}`, category, name: item.name, type: item.type })));

/* ===== 3. ฟังก์ชันช่วย ===== */
const $ = id => document.getElementById(id);
const say = text => { $("msg").textContent = text || ""; };
const esc = v => String(v ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const color = category => `var(--c${CATEGORIES.findIndex(c => c[0] === category) % 8})`;
const bySchool = () => "school=eq." + encodeURIComponent(me.name);

async function api(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: HEADERS, ...options });
  if (!res.ok) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

// จัดกลุ่มกิจกรรมตามหมวด: card(a) คือ HTML ของแต่ละกิจกรรม
function groupedHtml(list, card) {
  let html = "", last = "";
  list.forEach(a => {
    if (a.category !== last) {
      html += (last ? "</div>" : "") + `<div class="box cat"><h3 style="background:${color(a.category)}">${esc(a.category)}</h3>`;
      last = a.category;
    }
    html += card(a);
  });
  return html + (last ? "</div>" : "");
}

/* ===== 4. เข้าสู่ระบบ และสลับหน้า ===== */
let me = null;      // โรงเรียนที่เข้าสู่ระบบอยู่
let saved = {};     // รหัสกิจกรรมที่เคยบันทึกไว้

function login() {
  const digits = "๐๑๒๓๔๕๖๗๘๙";
  const typed = $("codeInput").value.replace(/[๐-๙]/g, c => digits.indexOf(c)).replace(/\s/g, "");
  me = SCHOOLS.find(s => s.code === typed);
  if (!me) return say("รหัสไม่ถูกต้อง");
  $("codeInput").value = "";
  $("pageLogin").classList.add("hide");
  $("nav").classList.remove("hide");
  $("subtitle").textContent = me.name;
  showTab(1);
}

function logout() {
  me = null;
  ["page1", "page2", "page3", "nav", "saveBar"].forEach(id => $(id).classList.add("hide"));
  $("pageLogin").classList.remove("hide");
  $("subtitle").textContent = SUBTITLE;
  say("");
}

// 1 = สมัคร, 2 = สรุปของโรงเรียน, 3 = สรุปรวม
function showTab(n) {
  [1, 2, 3].forEach(i => {
    $("page" + i).classList.toggle("hide", i !== n);
    $("nav" + i).classList.toggle("on", i === n);
  });
  $("saveBar").classList.toggle("hide", n !== 1);
  say("กำลังโหลด...");
  [loadForm, loadMySummary, loadAllSummary][n - 1]()
    .then(() => say(""))
    .catch(e => say("โหลดไม่สำเร็จ: " + e.message));
}

/* ===== 5. หน้าสมัคร ===== */
const updateCount = () => { $("count").textContent = document.querySelectorAll("#page1 input:checked").length; };

async function loadForm() {
  const rows = await api("registrations?select=activity_code&" + bySchool());
  saved = {};
  rows.forEach(r => { saved[r.activity_code] = 1; });

  $("page1").innerHTML = groupedHtml(ACTIVITIES, a => `
    <label class="item">
      <input type="checkbox" value="${a.code}" ${saved[a.code] ? "checked" : ""} onchange="updateCount()">
      <span>${esc(a.name)} <span class="tag ${a.type === "เดี่ยว" ? "" : "team"}">${esc(a.type)}</span></span>
    </label>`);
  updateCount();
}

async function save() {
  const button = document.querySelector("#saveBar button");
  button.disabled = true;
  say("กำลังบันทึกข้อมูล...");

  const checked = new Set([...document.querySelectorAll("#page1 input:checked")].map(i => i.value));
  const toSave = ACTIVITIES.filter(a => checked.has(a.code)).map(a => ({
    school: me.name, activity_code: a.code, category: a.category, activity_name: a.name, type: a.type }));
  const toDelete = Object.keys(saved).filter(code => !checked.has(code));

  try {
    if (toSave.length) {
      await api("registrations?on_conflict=school,activity_code", {
        method: "POST", headers: { ...HEADERS, Prefer: "resolution=merge-duplicates" }, body: JSON.stringify(toSave) });
    }
    for (const code of toDelete) {
      await api(`registrations?${bySchool()}&activity_code=eq.${encodeURIComponent(code)}`, {
        method: "DELETE", headers: { ...HEADERS, Prefer: "return=minimal" } });
    }
    saved = {};
    toSave.forEach(r => { saved[r.activity_code] = 1; });
    say(`บันทึกสำเร็จ ${toSave.length} กิจกรรม`);
  } catch (e) {
    say("บันทึกไม่สำเร็จ: " + e.message);
  }
  button.disabled = false;
}

/* ===== 6. สรุปของโรงเรียนตัวเอง ===== */
async function loadMySummary() {
  const rows = await api("registrations?select=activity_code&" + bySchool());
  const codes = new Set(rows.map(r => r.activity_code));
  const mine = ACTIVITIES.filter(a => codes.has(a.code));

  $("page2").innerHTML = `
    <div class="stats"><div><b>${mine.length}</b>กิจกรรมที่สมัคร</div><div><b style="font-size:1rem">${esc(me.name)}</b>โรงเรียน</div></div>`
    + (mine.length ? "" : '<p class="card empty">โรงเรียนนี้ยังไม่ได้สมัครกิจกรรม</p>')
    + groupedHtml(mine, a => `<div class="card"><b>${esc(a.name)}</b><small>${esc(a.type)}</small></div>`);
}

/* ===== 7. สรุปรวม: มีผู้สมัคร (พร้อมรายชื่อโรงเรียน) / ไม่มีผู้สมัคร ===== */
async function loadAllSummary() {
  const rows = await api("registrations?select=school,activity_code");

  // รหัสกิจกรรม → รายชื่อโรงเรียนที่สมัคร
  const schoolsOf = {};
  rows.forEach(r => { (schoolsOf[r.activity_code] ||= new Set()).add(r.school); });

  const withApplicants = ACTIVITIES.filter(a => schoolsOf[a.code]);
  const withoutApplicants = ACTIVITIES.filter(a => !schoolsOf[a.code]);
  const applied = new Set(rows.map(r => r.school)).size;

  // แผนภูมิแท่ง: จำนวนกิจกรรมต่อโรงเรียน
  const counts = SCHOOLS.map(s => ({ name: s.name, n: rows.filter(r => r.school === s.name).length }));
  const max = Math.max(1, ...counts.map(c => c.n));
  const chart = counts.map(c => `
    <div class="bar-row"><div>${esc(c.name)}</div><div><i style="width:${c.n / max * 100}%"></i></div><b>${c.n}</b></div>`).join("");

  $("page3").innerHTML = `
    <div class="stats"><div><b>${rows.length}</b>รายการสมัครทั้งหมด</div><div><b>${applied}/${SCHOOLS.length}</b>โรงเรียนที่สมัครแล้ว</div></div>
    <div class="box chart"><b>จำนวนกิจกรรมที่แต่ละโรงเรียนสมัคร</b>${chart}</div>

    <h4>กิจกรรมที่มีโรงเรียนสมัคร (${withApplicants.length})</h4>`
    + groupedHtml(withApplicants, a => `
      <div class="card"><b>${esc(a.name)}</b>
        <small>${esc(a.type)} · สมัคร ${schoolsOf[a.code].size} โรงเรียน</small>
        ${[...schoolsOf[a.code]].map(s => `<span class="chip">${esc(s)}</span>`).join("")}
      </div>`)
    + `<h4 style="color:#b91c1c">กิจกรรมที่ไม่มีผู้สมัคร (${withoutApplicants.length})</h4>`
    + groupedHtml(withoutApplicants, a => `<div class="card empty"><b>${esc(a.name)}</b><small>${esc(a.type)}</small></div>`);
}

/* ===== 8. Admin (รหัส m304) ===== */
const ADMIN_CODE = "m304";

function openAdmin() {
  const code = prompt("กรุณากรอกรหัส Admin");
  if (code === null) return;
  if (code !== ADMIN_CODE) return say("รหัส Admin ไม่ถูกต้อง");
  say("");
  $("pageLogin").classList.add("hide");
  $("pageAdmin").classList.remove("hide");
}

function closeAdmin() {
  $("pageAdmin").classList.add("hide");
  $("pageLogin").classList.remove("hide");
  say("");
}

async function deleteSchool() {
  const name = $("adminSchool").value;
  if (!confirm(`ลบข้อมูลการสมัครทั้งหมดของ ${name} ใช่หรือไม่?`)) return;
  try {
    await api("registrations?school=eq." + encodeURIComponent(name), { method: "DELETE", headers: { ...HEADERS, Prefer: "return=minimal" } });
    say("ลบข้อมูลของ " + name + " แล้ว");
  } catch (e) { say("ลบไม่สำเร็จ: " + e.message); }
}

async function deleteAll() {
  if (!confirm("ลบข้อมูลการสมัครของทุกโรงเรียนใช่หรือไม่?")) return;
  if (!confirm("ยืนยันครั้งสุดท้าย: ข้อมูลทั้งหมดจะถูกลบและกู้คืนไม่ได้")) return;
  try {
    await api("registrations?school=not.is.null", { method: "DELETE", headers: { ...HEADERS, Prefer: "return=minimal" } });
    say("ลบข้อมูลทั้งหมดแล้ว");
  } catch (e) { say("ลบไม่สำเร็จ: " + e.message); }
}

/* ===== 9. เริ่มต้น ===== */
$("adminSchool").innerHTML = SCHOOLS.map(s => `<option>${esc(s.name)}</option>`).join("");
$("schoolList").innerHTML = SCHOOLS.map(s => `<li>${esc(s.name)}</li>`).join("");
</script>
